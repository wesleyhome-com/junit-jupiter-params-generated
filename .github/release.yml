# Groups the pull request list in generated GitHub release notes. A pull request goes under the
# first category whose labels it has; anything unlabeled ends up under "Other changes".
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: ⚠️ Breaking changes
      labels:
        - breaking
    - title: New features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Build, CI and docs
      labels:
        - build
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
