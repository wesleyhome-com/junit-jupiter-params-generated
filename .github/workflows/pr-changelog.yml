name: Check changelog and labels

# Separate from build-pr.yml so that adding or removing a label re-runs only this check.
on:
  pull_request:
    branches:
      - 'main'
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      # The merge commit's first parent is main, which is what the changelog is compared against.
      - name: Checkout the merged pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check CHANGELOG.md and labels
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          BASE="${RUNNER_TEMP}/base-CHANGELOG.md"
          git show HEAD^1:CHANGELOG.md > "${BASE}" 2>/dev/null || : > "${BASE}"
          PR_LABELS="$(jq -r '.[]' <<<"${LABELS_JSON}")" \
            bash .github/scripts/check-pr-changelog.sh "${BASE}" CHANGELOG.md
