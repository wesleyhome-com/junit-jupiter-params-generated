name: Publish Versioned Docs

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to (re)publish, for example 4.0.0. Its tag is checked out and documented.'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish-versioned-docs:
    runs-on: ubuntu-latest
    # Shared with build-main.yml: both read and write the stored site on gh-pages.
    concurrency:
      group: pages-site
      cancel-in-progress: false
    steps:
      - name: Resolve version and tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ ! "${TAG}" =~ ([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*)$ ]]; then
              echo "::error::Tag ${TAG} does not end in a version."
              exit 1
            fi
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="${INPUT_VERSION}"
            TAG=""
            for candidate in "v${VERSION}" "junit-jupiter-params-generated-${VERSION}"; do
              if git ls-remote --exit-code --tags "${REPOSITORY_URL}" "refs/tags/${candidate}" > /dev/null; then
                TAG="${candidate}"
                break
              fi
            done
            if [[ -z "${TAG}" ]]; then
              echo "::error::No tag found for version ${VERSION}."
              exit 1
            fi
          fi
          if [[ "${VERSION}" == *SNAPSHOT* ]]; then
            echo "::error::Refusing to publish versioned docs for snapshot version: ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout site scripts
        uses: actions/checkout@v7
        with:
          path: tools
          sparse-checkout: .github/scripts

      - name: Checkout ${{ steps.version.outputs.tag }}
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          path: source

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Generate documentation
        working-directory: source
        run: ./gradlew dokkaGenerate --no-daemon

      - name: Checkout stored site
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build site
        run: >-
          bash tools/.github/scripts/build-pages-site.sh
          release source/docs gh-pages site "${{ steps.version.outputs.version }}"

      - name: Store site on gh-pages
        run: >-
          bash tools/.github/scripts/store-pages-site.sh
          site gh-pages "Docs for ${{ steps.version.outputs.version }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
