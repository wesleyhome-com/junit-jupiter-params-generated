name: Build Gradle project

on:
  push:
    branches:
      - 'main'
permissions:
  contents: read

jobs:
  build-snapshot-gradle-project:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Run build with Gradle Wrapper
        run: ./gradlew build dokkaGenerate --no-daemon
      - name: Detect snapshot version
        id: version
        shell: bash
        run: |
          VERSION="$(grep '^version=' gradle.properties | cut -d'=' -f2)"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *SNAPSHOT ]]; then
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish SNAPSHOT artifacts to Maven Central
        if: steps.version.outputs.is_snapshot == 'true'
        run: ./gradlew publishProjectSnapshotsToMavenCentral --no-daemon
      - name: Keep generated docs for the docs job
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-docs
          path: docs
          retention-days: 1

  publish-snapshot-docs:
    needs: build-snapshot-gradle-project
    runs-on: ubuntu-latest
    # Shared with docs-version-release.yml: both read and write the stored site on gh-pages.
    concurrency:
      group: pages-site
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7
      - name: Download generated docs
        uses: actions/download-artifact@v8
        with:
          name: snapshot-docs
          path: docs
      - name: Checkout stored site
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
      - name: Build site
        run: bash .github/scripts/build-pages-site.sh snapshot docs gh-pages site
      - name: Store site on gh-pages
        run: bash .github/scripts/store-pages-site.sh site gh-pages "Snapshot docs from ${GITHUB_SHA}"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
