name: Build pull request

on:
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

concurrency:
  group: build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Run build with Gradle Wrapper
        run: ./gradlew build dokkaGenerate --no-daemon
      - name: Test Kotlin 2.2 consumers
        run: bash .github/scripts/consumer-smoke-test.sh --no-daemon

  floor-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Run the tests on the oldest Kotlin runtime and JUnit supported
        run: ./gradlew check -PkotlinRuntime=2.2.21 -PjunitVersion=6.0.3 --no-daemon
