name: Release To Maven Central

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version to publish, e.g. 4.0.2'
        required: true
        type: string
      next_version:
        description: 'Next version to write after release, e.g. 0.2.1-SNAPSHOT'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Creates the GitHub release. Pushes to main still need the deploy key; the ruleset blocks this token.
      contents: write
      # Checks and closes the version's milestone. It also lets the token edit issues, labels and comments.
      issues: write
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      # main requires pull requests; only this deploy key may push the release commits and tag.
      - name: Require the release deploy key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "${RELEASE_DEPLOY_KEY}" ]; then
            echo "::error::Secret RELEASE_DEPLOY_KEY is not set. Nothing was built or published."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Check the release can push its commits and tag
        env:
          TAG: v${{ inputs.release_version }}
        run: bash .github/scripts/check-release-push.sh "${TAG}"

      - name: Check the version's milestone is finished
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
        run: bash .github/scripts/release-milestone.sh check "${VERSION}"

      # The same JDK as build-pr.yml and build-main.yml, so the release builds what CI tested.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run release plugin and publish
        run: >-
          ./gradlew release
          -Prelease.releaseVersion=${{ inputs.release_version }}
          -Prelease.newVersion=${{ inputs.next_version }}
          --no-daemon

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
        run: |
          TAG="v${VERSION}"
          PREVIOUS_TAG="$(bash .github/scripts/previous-release-tag.sh "${TAG}")"
          git show "${TAG}:CHANGELOG.md" > "${RUNNER_TEMP}/CHANGELOG.md"
          SECTION="$(bash .github/scripts/changelog-section.sh "${VERSION}" "${RUNNER_TEMP}/CHANGELOG.md")"
          NOTES="$(printf 'Docs: https://junit-params.wesleyhome.com/v/%s/\n\n%s' "${VERSION}" "${SECTION}")"
          ARGS=(--verify-tag --title "${TAG}" --generate-notes --notes "${NOTES}")
          if [[ -n "${PREVIOUS_TAG}" ]]; then
            ARGS+=(--notes-start-tag "${PREVIOUS_TAG}")
          fi
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ARGS+=(--latest)
          else
            ARGS+=(--prerelease --latest=false)
          fi
          gh release create "${TAG}" "${ARGS[@]}"

      - name: Close the version's milestone
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
        run: bash .github/scripts/release-milestone.sh close "${VERSION}"
