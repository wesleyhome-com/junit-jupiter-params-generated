name: Release To Maven Central

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release, e.g. 4.2.0. Blank: the version in gradle.properties, without -SNAPSHOT'
        required: false
        default: ''
        type: string
      next_version:
        description: 'Version main moves to afterwards, e.g. 4.3.0-SNAPSHOT. Blank: the next patch version, or 4.2.0-SNAPSHOT after a pre-release such as 4.2.0-RC1'
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every later job uses these outputs rather than the inputs, which may be blank.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.versions.outputs.release_version }}
      next_version: ${{ steps.versions.outputs.next_version }}
      tag: ${{ steps.versions.outputs.tag }}
    steps:
      - name: Checkout gradle.properties and the release scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Resolve the release versions
        id: versions
        env:
          TYPED_RELEASE_VERSION: ${{ inputs.release_version }}
          TYPED_NEXT_VERSION: ${{ inputs.next_version }}
        run: bash .github/scripts/resolve-release-versions.sh "${TYPED_RELEASE_VERSION}" "${TYPED_NEXT_VERSION}"

  # A job of its own, so that a release with unfinished work stops in seconds and the release job's
  # token gets no access to issues.
  milestone-check:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      # Without it, the issues listing leaves out pull requests.
      pull-requests: read
    steps:
      - name: Checkout the release scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Check the version's milestone is finished
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.versions.outputs.release_version }}
        run: bash .github/scripts/release-milestone.sh check "${VERSION}"

  release:
    needs: [versions, milestone-check]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Creates the GitHub release. Pushes to main still need the deploy key; the ruleset blocks this token.
      contents: write
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      # main requires pull requests; only this deploy key may push the release commits and tag.
      - name: Require the release deploy key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "${RELEASE_DEPLOY_KEY}" ]; then
            echo "::error::Secret RELEASE_DEPLOY_KEY is not set. Nothing was built or published."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Check the release can push its commits and tag
        env:
          TAG: ${{ needs.versions.outputs.tag }}
        run: bash .github/scripts/check-release-push.sh "${TAG}"

      # The same JDK as build-pr.yml and build-main.yml, so the release builds what CI tested.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run release plugin and publish
        env:
          RELEASE_VERSION: ${{ needs.versions.outputs.release_version }}
          NEXT_VERSION: ${{ needs.versions.outputs.next_version }}
        run: >-
          ./gradlew release
          "-Prelease.releaseVersion=${RELEASE_VERSION}"
          "-Prelease.newVersion=${NEXT_VERSION}"
          --no-daemon

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.versions.outputs.release_version }}
          TAG: ${{ needs.versions.outputs.tag }}
        run: |
          PREVIOUS_TAG="$(bash .github/scripts/previous-release-tag.sh "${TAG}")"
          git show "${TAG}:CHANGELOG.md" > "${RUNNER_TEMP}/CHANGELOG.md"
          SECTION="$(bash .github/scripts/changelog-section.sh "${VERSION}" "${RUNNER_TEMP}/CHANGELOG.md")"
          NOTES="$(printf 'Docs: https://junit-params.wesleyhome.com/v/%s/\n\n%s' "${VERSION}" "${SECTION}")"
          ARGS=(--verify-tag --title "${TAG}" --generate-notes --notes "${NOTES}")
          if [[ -n "${PREVIOUS_TAG}" ]]; then
            ARGS+=(--notes-start-tag "${PREVIOUS_TAG}")
          fi
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ARGS+=(--latest)
          else
            ARGS+=(--prerelease --latest=false)
          fi
          gh release create "${TAG}" "${ARGS[@]}"

  close-milestone:
    needs: [versions, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The release is published by now. The script only warns, and nothing else here may fail the run.
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout the release scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Close the version's milestone
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.versions.outputs.release_version }}
        run: bash .github/scripts/release-milestone.sh close "${VERSION}"
